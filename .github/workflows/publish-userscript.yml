name: Publish userscript

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: userscript-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build userscript
        run: npm run build:userscript
      - name: Read userscript version
        id: userscript
        shell: bash
        run: |
          version="$(node -e 'const source = require("node:fs").readFileSync("extension/dist/slackoff-console.user.js", "utf8"); const match = source.match(/^\/\/ @version\s+(\S+)/m); if (!match) throw new Error("Missing userscript @version"); process.stdout.write(match[1]);')"
          echo "tag=userscript-v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Publish private release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.userscript.outputs.tag }}
          VERSION: ${{ steps.userscript.outputs.version }}
        shell: bash
        run: |
          asset="extension/dist/slackoff-console.user.js"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --title "Slackoff Console ${VERSION}" \
              --notes "Tampermonkey userscript built from ${GITHUB_SHA}." \
              --latest
          fi
          gh release edit "$TAG" --latest
